[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabarena"
version = "0.1.0"  # keep equal to packages/bencheval/pyproject.toml; PyPI releases ship both at one version
description = "A Living Benchmark for Machine Learning on Tabular Data"
# README.md, LICENSE and NOTICE are not in this directory: scripts/release/build_pypi_dists.py copies
# the repository's README.md (links made absolute), LICENSE and NOTICE next to this file when
# building for PyPI (setuptools picks up LICENSE* and NOTICE* automatically).
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "TabArena Community" }]
requires-python = ">=3.11,<3.14"
keywords = [
  "tabular",
  "machine-learning",
  "benchmark",
  "automl",
  "autogluon",
  "ensemble",
  "deep-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: To allow pre-release resolution of AutoGluon with uv, install with:
#   uv pip install --prerelease=allow .
dependencies = [
  # Minimal evaluation/leaderboard core. Heavier capabilities live in
  # the optional extras below: plotting -> [plot], text embeddings -> [text],
  # skrub feature generators -> [preprocessing], model fitting -> [benchmark].
  #
  # We depend on `autogluon.tabular` (the tabular distribution) rather than the full
  # `autogluon` meta-package, which would also pull in `autogluon.multimodal` /
  # `autogluon.timeseries` (torch, transformers, ...). `autogluon.tabular` transitively
  # provides `autogluon.{common,core,features}`, which is everything the code uses.
  # To use `uv`, you need to do `uv pip install --prerelease=allow .` so it recognizes pre-release AutoGluon.
  # The shared-weights API (autogluon.core.models.abstract.SharedWeights) that the foundation-model
  # wrappers import landed on AutoGluon's master on 2026-09-16 and ships in the nightlies from
  # 1.6.3b20260917 on. The 1.6.3 release of 2026-09-18 was cut without it, so it is excluded; a pin
  # that names a pre-release also lets pip consider the nightlies without `--pre`.
  "autogluon.tabular>=1.6.3b20260917,!=1.6.3,<1.7",
  # core's [ray] extra is exactly ray[default] at the range autogluon.core pins, so the
  # two cannot drift apart. (Not autogluon.tabular[ray]: that maps to core[all], which
  # additionally drags in raytune's hyperopt/stevedore/ray[tune].) autogluon.core is
  # already a transitive dependency via autogluon.tabular, so this adds only ray.
  "autogluon.core[ray]>=1.6,<1.7",
  "bencheval",
  "openml>=0.14.1",
  "pyyaml",
  "tqdm",
  "typing-extensions>=4.11,<5",  # used for `Self` type hint
  "huggingface-hub",
  "numpy",
  "pandas",
  "tabulate",  # pandas DataFrame.to_markdown() for leaderboard output
  "loguru",
]

[project.optional-dependencies]

# Requirements with a direct URL (`name @ git+https://...`) install from a git checkout but cannot
# be published to PyPI. `scripts/release/build_pypi_dists.py` strips them from the PyPI build, which
# leaves that extra empty on PyPI; the model's `pip_extra` in its `info.py` keeps the exact git
# dependency for the install hint. Use a PyPI release whenever the upstream package has one.

# Plotting / leaderboard visualization (the `tabarena.plot` modules + bencheval plots).
# All plotting imports are lazy, so the core install never requires these.
plot = [
  # matplotlib/seaborn/plotly pins are single-sourced in bencheval's `plot` extra;
  # bencheval itself is already a base dependency, so this only activates the extra.
  "bencheval[plot]",
  "tueplots",
  "autorank==1.2.1",
  "adjusttext",  # for pareto front plots
]

# Semantic text features: the sentence-transformers embedding model used by the
# tabarena_default preprocessing. Heavy (pulls torch); imported lazily at encode time.
text = ["sentence_transformers>=5.4"]

# skrub-based feature generators (datetime + statistical-text) used by the
# tabarena_default preprocessing. Light; imported lazily inside the generators.
preprocessing = ["skrub"]

# Data Foundry integration: lets `tabarena.benchmark.task.data_foundry` convert
# curated containers into TabArena UserTasks. Included in the `benchmark` union.
# FIXME: To use `uv`, you need to do `uv pip install --prerelease=allow .` so it recognizes pre-release data-foundry
data-foundry = ["data-foundry>=0.0.3"]

# Core model extras — installed together via the `benchmark` union below.
tabpfn = [
  "tabpfn>=8.0.8",
  "tabpfn-extensions[many_class]>=0.6.1",
]
tabicl = ["tabicl>=2.0.0"]
ebm = ["autogluon.tabular[interpret]>=1.6,<1.7"]
search_spaces = ["configspace>=1.2,<2.0"]
realmlp = ["pytabkit>=1.5.0,<2.0"]
# TabDPT-1.3's shared-weights loader (`TabDPTEstimator._load_model`, layer6ai-labs/TabDPT-inference#79)
# merged after the 1.3.0 release; pinned to that merge until a release ships it.
tabdpt = ["tabdpt @ git+https://github.com/layer6ai-labs/TabDPT-inference.git@336ed08fd38ebdd63fbe5b345734f7df287aa5d6"]
tabm = ["torch", "tabm>=0.0.3", "rtdl_num_embeddings>=0.0.12"]

# Extended model extras — opt-in individually or together via the `extended` union below.
causilo = ["causilo==1.0.0"]
modernnca = ["category_encoders"]
xrfm = ["xrfm[cu12]"]
# sap-rpt-oss and tabfm stay pinned to the git commits used for the benchmark runs, so these two
# extras are empty on PyPI (see the note at the top of this table).
sap-rpt-oss = ["sap_rpt_oss @ git+https://github.com/SAP-samples/sap-rpt-1-oss.git@a323a0aff976fda4ac43c3196a92406de7689aaa"]
# TabFM uses its PyTorch backend; the `[pytorch]` extra pulls `torch` for GPU/CPU execution.
# Pinned to the same commit as tabfm/info.py's ModelInfo.pip_extra, so `pip install`
# and the model registry's own metadata agree on which estimator was tuned.
tabfm = ["tabfm[pytorch] @ git+https://github.com/google-research/tabfm.git@633cd265f498e1d20c9625be0639f6305d8e2541"]
tabstar = ["tabstar==1.1.15"]
perpetualboosting = ["perpetual"] # We used version 2.1.0
# The benchmark runs installed TabTune from git main (kept as `pip_extra` in models/orionmsp/info.py);
# 0.1.18 is the PyPI release that ships the `orionmsp_v15` modules the wrapper imports.
orionmsp = ["tabtune==0.1.18"]
probmetrics = [
    "probmetrics",
    "pytorch-minimize",
]
limix = [
  "einops",
  "kditransform",
]
# LimiX-2's inference package is not on PyPI (pinned to a commit; keep in sync with `pip_extra` in
# models/limix_2/info.py; empty extra on PyPI, see the note at the top of this table) and pins
# torch==2.9.1, which would replace the torch every other model runs on. The extra is therefore left
# out of `extended` and `all`; install it without its dependency tree next to the existing torch:
#   uv pip install --no-deps "LimiX @ git+https://github.com/limix-ldm-ai/LimiX.git@774aa3e1a994cbe38f33758e3d663e9951855554" nvtx
limix_2 = [
  "LimiX @ git+https://github.com/limix-ldm-ai/LimiX.git@774aa3e1a994cbe38f33758e3d663e9951855554",
  "nvtx",
]
tabpfnwide = ["tabpfnwide>=0.3.0"]
iltm = ["iltm>=0.1.1"]
chimeraboost = ["chimeraboost>=0.30.0"]
ctboost = ["ctboost==0.1.61"]
nori = ["synthefy-nori>=0.10.0"]
aplr = ["aplr>=10.26.0"]
# EXAONE Tabular is not published on PyPI; pinned to a commit so the benchmarked code is fixed
# (empty extra on PyPI). Keep in sync with `pip_extra` in models/exaone_tabular/info.py.
exaone_tabular = [
  "exaonetabular @ git+https://github.com/LGAI-Research/EXAONE-Tabular.git@cf55bd2d74aeb9c0b5d5d4f509d05831251a827e",
]
# TabSwift is vendored under models/tabswift/_vendor/ (not pip-installable). All of its
# runtime deps (torch, numpy, scikit-learn, scipy, psutil, tqdm, huggingface_hub, packaging)
# are already in the base tree, so this extra is intentionally empty.
tabswift = []
# TabLDM is not published on PyPI; pinned to a commit so the benchmarked code is fixed.
# Keep in sync with `pip_extra` in models/tabldm/info.py.
tabldm = ["Xiaomi-TabLDM @ git+https://github.com/xiaomi-research/xiaomi-tabldm.git@6773a30d43e43fad3e8b474e20ca8c7ec40dcd76"]
# Mitra-v2 runs on AutoGluon's Mitra implementation; this is AutoGluon's own `mitra` extra
# (loguru, einops, transformers, huggingface_hub, ...). Keep in sync with models/mitra_v2/info.py.
# flash-attn is optional (faster attention, same results) and needs a prebuilt wheel:
# `pip install flash-attn --no-build-isolation`.
mitra_v2 = ["autogluon.tabular[mitra]>=1.6,<1.7"]
# TabPFN-3.5 / TabPFN-3.5-Fast need the release that ships the v3.5 checkpoints; the shared
# `tabpfn` extra above stays at the floor the earlier TabPFN versions were benchmarked with.
tabpfn_3_5 = ["tabpfn>=9.0.0"]

# Core benchmark set: the always-on models for benchmarking, plus the plotting and
# preprocessing capabilities split out of the core install. Self-references avoid
# duplicating package specs.
benchmark = [
  "tabarena[tabpfn]",
  "tabarena[tabicl]",
  "tabarena[ebm]",
  "tabarena[search_spaces]",
  "tabarena[realmlp]",
  "tabarena[tabdpt]",
  "tabarena[tabm]",
  "tabarena[data-foundry]",
  "tabarena[plot]",
  "tabarena[text]",
  "tabarena[preprocessing]",
]

# Extended set: extra models layered on top of `benchmark` when needed.
# Note: `probmetrics` is intentionally excluded — install it explicitly via `tabarena[probmetrics]` or `tabarena[all]`.
extended = [
  "tabarena[causilo]",
  "tabarena[modernnca]",
  "tabarena[xrfm]",
  "tabarena[sap-rpt-oss]",
  "tabarena[tabfm]",
  "tabarena[tabstar]",
  "tabarena[perpetualboosting]",
  "tabarena[orionmsp]",
  "tabarena[limix]",
  "tabarena[tabpfnwide]",
  "tabarena[iltm]",
  "tabarena[chimeraboost]",
  "tabarena[ctboost]",
  "tabarena[nori]",
  "tabarena[aplr]",
  "tabarena[tabswift]",
  "tabarena[exaone_tabular]",
  "tabarena[tabldm]",
  "tabarena[mitra_v2]",
  "tabarena[tabpfn_3_5]",
]

# Convenience: everything (core + extended + probmetrics).
all = [
  "tabarena[benchmark]",
  "tabarena[extended]",
  "tabarena[probmetrics]",
]

[project.urls]
Homepage = "https://github.com/autogluon/tabarena"
Leaderboard = "https://tabarena.ai/"
Repository = "https://github.com/autogluon/tabarena"
Issues = "https://github.com/autogluon/tabarena/issues"
"Paper (TabArena)" = "https://arxiv.org/abs/2506.16791"
"Paper (BeyondArena)" = "https://arxiv.org/abs/2606.30410"

# PEP 735 dependency groups: dev-only tools, not shipped in the wheel.
# Install with: `uv sync --group dev`  (or `--group lint`, `--group test`).
# NOTE: keep the ruff pin in sync with .github/workflows/pytest-pytest.yml and
# .pre-commit-config.yaml so local, pre-commit, and CI all agree.
[dependency-groups]
lint = ["ruff==0.14.0"]
test = ["pytest>=7"]
dev = [{ include-group = "lint" }, { include-group = "test" }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["tabarena*"]

# Non-Python files shipped in the wheel, matched recursively so vendored models (configs, licenses)
# are picked up wherever they live. `scripts/release/build_pypi_dists.py` fails the build when a
# git-tracked non-.py file under src/ is missing from the wheel. Compiled `.so` files are not
# shipped: the C++ metrics compile on first use from the shipped sources.
[tool.setuptools.package-data]
tabarena = [
  "**/*.csv",
  "**/*.json",
  "**/*.sh",
  "**/*.cpp",
  "**/*.md",
  "**/LICENSE*",
]
